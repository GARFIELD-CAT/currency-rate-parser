spring.application.name=currency_rate_parser
server.port=8080

# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/master_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driverClassName=org.postgresql.Driver

logging.level.org.springframework.data=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

spring.jpa.hibernate.ddl-auto=update

# === Actuator ===
management.endpoints.web.exposure.include=health,info,metrics,loggers,threaddump,prometheus
management.metrics.enable.http-server-requests=true
management.metrics.export.prometheus.enabled=true
management.endpoint.env.show-values=always
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metric.tags.application=${spring.application.name}

# === /info ===
info.app.name=Currency rate parser
info.app.version=1.0.0
info.app.description=Application for monitoring the current currency exchange rate
info.contact.email=spb.jagunov.denis@gmail.com

spring.datasource.hikari.maximum-pool-size=50